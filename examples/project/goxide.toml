[package]
format = 2
module = "example.org/goxide-project"
go = "1.27"

[package.namespaces]
greeting = "example.org/goxide-project"

[[bin]]
name = 'hello'
path = 'src/main.gox'

[[bin]]
name = 'inspect'
path = 'src/inspect.gox'

[[example]]
name = 'greet'
path = 'examples/greet.gox'

[features]
default = ['pretty']
pretty = []

[lib]
name = 'greeting'
path = 'src/lib.gox'


[[go.require]]
module = "github.com/goxide-lang/serde"
version = "v0.0.0-20261009021520-f342a31e20d0"

[[go.require]]
module = "github.com/goxide-lang/std"
version = "v0.0.0-20261009104839-c02a09d8c417"

[dependencies.fmt]
source = "toolchain"
package = "fmt"
