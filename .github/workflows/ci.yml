name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: true
      go_version:
        type: string
        required: true
      release_tag:
        type: string
        default: ''
      release_prerelease:
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.checkout_ref || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CGO_ENABLED: '1'
  GOTOOLCHAIN: local
  GOMAXPROCS: '4'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      web: ${{ steps.paths.outputs.web }}
      commit: ${{ steps.identity.outputs.commit }}
      go_version: ${{ steps.identity.outputs.go_version }}
      version: ${{ steps.identity.outputs.version }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ inputs.go_version }}
          go-version-file: go.mod
          cache: false
      - name: Resolve one source and toolchain for checks and artifacts
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_PRERELEASE: ${{ inputs.release_prerelease }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          commit = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          go_version = subprocess.check_output(['go', 'env', 'GOVERSION'], text=True).strip().removeprefix('go')
          tag = os.environ['RELEASE_TAG']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print(f'commit={commit}', file=out)
              print(f'go_version={go_version}', file=out)
              print(f'version={tag or "dev-" + commit[:12]}', file=out)
              print(f'prerelease={os.environ["RELEASE_PRERELEASE"] if tag else "true"}', file=out)
          PY
      - name: Select the website job
        id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          CHECKOUT_REF: ${{ inputs.checkout_ref }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          base = os.environ['BASE_SHA']
          has_base = not os.environ['CHECKOUT_REF'] and bool(base) and set(base) != {'0'}
          if has_base:
              separator = '...' if os.environ['EVENT_NAME'] == 'pull_request' else '..'
              changed = subprocess.check_output([
                  'git', 'diff', '--name-only', '-z',
                  base + separator + os.environ['HEAD_SHA'],
              ]).decode().split('\0')
          else:
              changed = []
          ci = any(p.startswith(('.github/', 'scripts/ci_')) for p in changed)
          web = not has_base or ci or any(
              p in (
                  'go.mod', 'go.sum', 'scripts/build.go',
                  'docs/website-guide.md', 'docs/using-goxide-gen.md',
                  'docs/procedural-macros.md', 'docs/syntax-tools.md', 'docs/mvp-gap-audit.md',
                  'docs/design/reading-guide.md', 'docs/design/language-grammar.md',
                  'docs/design/translation-semantics.md', 'docs/design/frontend-ast.md',
                  'docs/design/enum-representation.md', 'docs/design/decisions.md',
              ) or p.startswith((
                  'website/', 'cmd/', 'internal/',
                  'examples/', 'docs/rfcs/',
              )) for p in changed)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              print(f'web={str(web).lower()}', file=out)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              print(f'Website job (including sandboxed browser QA): {web}.', file=out)
          PY

  checks:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.scope.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ needs.scope.outputs.go_version }}
          cache-dependency-path: go.sum
      - name: Prepare the pinned module graph
        run: |
          go version
          gcc --version
          echo "GO_BIN=$(command -v go)" >> "$GITHUB_ENV"
          module_prep_dir="$(mktemp -d "$RUNNER_TEMP/modules.XXXXXX")"
          cp go.mod go.sum "$module_prep_dir/"
          GOWORK=off GOFLAGS=-mod=readonly go mod download -modfile="$module_prep_dir/go.mod" all
          GOWORK=off GOFLAGS=-mod=readonly go mod verify -modfile="$module_prep_dir/go.mod"
          cmp go.mod "$module_prep_dir/go.mod"
          cmp go.sum "$module_prep_dir/go.sum"
      - name: Go formatting gate
        run: |
          unformatted="$(gofmt -l cmd internal tests)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Native vet gate
        run: env -u GOWORK go vet -mod=readonly ./...
      - name: Documentation and design gate
        run: python3 -B scripts/check_design.py
      - name: Ensure checks did not change tracked inputs
        run: git diff --exit-code

  race:
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        group: [core, compile-1, compile-2, lower, lsp, cli, prototype, acceptance-1, acceptance-2, acceptance-3, acceptance-4]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.scope.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ needs.scope.outputs.go_version }}
          cache-dependency-path: go.sum
      - name: Prepare the pinned module graph
        run: |
          go version
          gcc --version
          echo "GO_BIN=$(command -v go)" >> "$GITHUB_ENV"
          module_prep_dir="$(mktemp -d "$RUNNER_TEMP/modules.XXXXXX")"
          cp go.mod go.sum "$module_prep_dir/"
          GOWORK=off GOFLAGS=-mod=readonly go mod download -modfile="$module_prep_dir/go.mod" all
          GOWORK=off GOFLAGS=-mod=readonly go mod verify -modfile="$module_prep_dir/go.mod"
          cmp go.mod "$module_prep_dir/go.mod"
          cmp go.sum "$module_prep_dir/go.sum"
      - name: Restore compiled WASM modules
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/goxide/wazero
          key: wazero-${{ runner.os }}-${{ runner.arch }}-${{ needs.scope.outputs.go_version }}-${{ hashFiles('go.sum') }}-${{ matrix.group }}-${{ needs.scope.outputs.commit }}
          restore-keys: |
            wazero-${{ runner.os }}-${{ runner.arch }}-${{ needs.scope.outputs.go_version }}-${{ hashFiles('go.sum') }}-${{ matrix.group }}-
      - name: Install the pinned gopls for real backend contracts
        if: matrix.group == 'lsp'
        run: |
          lsp_tools_dir="$RUNNER_TEMP/lsp-tools"
          GOWORK=off GOBIN="$lsp_tools_dir" go install golang.org/x/tools/gopls@v0.24.0
          "$lsp_tools_dir/gopls" version
          echo "$lsp_tools_dir" >> "$GITHUB_PATH"
      - name: Install Delve for real debug adapter contracts
        if: matrix.group == 'cli'
        run: |
          debug_tools_dir="$RUNNER_TEMP/debug-tools"
          GOWORK=off GOBIN="$debug_tools_dir" go install github.com/go-delve/delve/cmd/dlv@v1.27.2
          "$debug_tools_dir/dlv" version
          echo "GOXIDE_TEST_DLV=$debug_tools_dir/dlv" >> "$GITHUB_ENV"
      - name: Native race gate
        timeout-minutes: 150
        env:
          RACE_GROUP: ${{ matrix.group }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          environment = os.environ.copy()
          environment.pop('GOWORK', None)
          go = environment['GO_BIN']
          module = subprocess.check_output([go, 'list', '-mod=readonly', '-m'], env=environment, text=True).strip()
          packages = subprocess.check_output([go, 'list', '-mod=readonly', '-race', './...'], env=environment, text=True).splitlines()
          dedicated = {
              'compile': [module + '/internal/compile'],
              'lower': [module + '/internal/lower'],
              'lsp': [module + '/internal/lsp', module + '/internal/lsp/gopls'],
              'cli': [module + '/cmd/goxide'],
              'prototype': [module + '/tests/prototype'],
              'acceptance': [module + '/tests/acceptance'],
          }
          isolated = {package for selected in dedicated.values() for package in selected}
          groups = {**dedicated, 'core': [package for package in packages if package not in isolated]}
          planned = [package for selected in groups.values() for package in selected]
          assert all(groups.values()) and len(planned) == len(set(planned))
          assert sorted(planned) == sorted(packages), 'race plan must cover every package exactly once'
          group = environment['RACE_GROUP']
          kind, separator, suffix = group.rpartition('-')
          shard_count = {'compile': 2, 'acceptance': 4}.get(kind) if separator else None
          shard = int(suffix) - 1 if shard_count else None
          selected = groups[kind if shard is not None else group]
          arguments = ['-mod=readonly', '-race', '-p=2' if group == 'core' else '-p=1',
                       '-vet=off', '-count=1', '-timeout=120m']
          names = []
          if shard is not None:
              listing = subprocess.check_output([go, 'test', '-mod=readonly', '-race', '-vet=off',
                                                 '-list', '^(Test|Example|Fuzz)', *selected],
                                                env=environment, text=True)
              names = sorted(line for line in listing.splitlines()
                             if re.fullmatch(r'(Test|Example|Fuzz)\w*', line))
              shards = [names[index::shard_count] for index in range(shard_count)]
              flattened = [name for part in shards for name in part]
              assert shard in range(shard_count) and all(shards) and len(flattened) == len(set(flattened))
              assert sorted(flattened) == names, f'{kind} shards must cover every test exactly once'
              names = shards[shard]
              arguments += ['-run', '^(' + '|'.join(re.escape(name) for name in names) + ')$']
          print(f'Race {group}: {len(selected)} of {len(packages)} packages', flush=True)
          for name in selected + names:
              print(name, flush=True)
          with open(environment['GITHUB_STEP_SUMMARY'], 'a') as summary:
              print(f'### Race {group}\n\n' + '\n'.join(f'- `{name}`' for name in selected + names) + '\n', file=summary)
          os.execve(sys.executable, [sys.executable, '-B', 'scripts/ci_go_test.py', 'race-' + group,
                                    *arguments, *selected], environment)
          PY
      - name: Reject skipped backend and debugger contracts
        if: matrix.group == 'lsp' || matrix.group == 'cli'
        env:
          RACE_GROUP: ${{ matrix.group }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          allowed = {'TestLanguageServerInteractionBudget', 'TestLanguageServerBackendBudgetResources',
                     'TestGoplsResourceRetention'} if os.environ['RACE_GROUP'] == 'lsp' else set()
          logs = list(Path(os.environ['RUNNER_TEMP']).glob('goxide-go-test-*/go-test.jsonl'))
          assert logs, 'missing test execution logs'
          skipped = []
          for log in logs:
              for line in log.read_text().splitlines():
                  event = json.loads(line)
                  if event.get('Action') == 'skip' and event.get('Test') not in allowed:
                      skipped.append((event.get('Package'), event.get('Test')))
          assert not skipped, f'unexpected skipped contracts: {skipped}'
          PY
      - name: Ensure checks did not change tracked inputs
        run: git diff --exit-code
      - name: Preserve race test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: go-test-race-${{ matrix.group }}
          path: ${{ runner.temp }}/goxide-go-test-*/
          if-no-files-found: ignore
          retention-days: 7

  native:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.scope.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ needs.scope.outputs.go_version }}
          cache-dependency-path: go.sum
      - name: Prepare the pinned module graph
        run: |
          go version
          gcc --version
          echo "GO_BIN=$(command -v go)" >> "$GITHUB_ENV"
          module_prep_dir="$(mktemp -d "$RUNNER_TEMP/modules.XXXXXX")"
          cp go.mod go.sum "$module_prep_dir/"
          GOWORK=off GOFLAGS=-mod=readonly go mod download -modfile="$module_prep_dir/go.mod" all
          GOWORK=off GOFLAGS=-mod=readonly go mod verify -modfile="$module_prep_dir/go.mod"
          cmp go.mod "$module_prep_dir/go.mod"
          cmp go.sum "$module_prep_dir/go.sum"
      - name: Native-only WASI snapshot contracts
        run: >-
          python3 -B scripts/ci_go_test.py native-snapshots
          -mod=readonly -p=1 -vet=off -count=1 -timeout=15m
          -run '^(TestProcSnapshotPreparedRoleLifetime|TestPackageCheckedProceduralSnapshot)$'
          ./internal/lower ./internal/playground
      - name: Production WASI invocation and cumulative budgets
        run: >-
          python3 -B scripts/ci_go_test.py native-budgets
          -mod=readonly -p=1 -vet=off -count=1 -timeout=15m
          -run '^TestWASIHost(SDKCommand|GoPackageInitIsBounded|TimeoutCancellationAndCumulativeBudget)$'
          ./internal/procmacro
      - name: Published std and serde under production budgets
        run: >-
          python3 -B scripts/ci_go_test.py native-protocols
          -mod=readonly -p=1 -vet=off -count=1 -timeout=15m
          -run '^TestFormalCFGDerivedProtocols$/^true$' ./internal/compile
      - name: Formatted source under production budgets
        run: >-
          python3 -B scripts/ci_go_test.py native-format
          -mod=readonly -p=1 -vet=off -count=1 -timeout=15m
          -run '^TestFormattedTraitsMatchMacrosAndGenericsBuildAndRun$' ./internal/format
      - name: Formal fixture under production budgets
        run: >-
          python3 -B scripts/ci_go_test.py native-formal-fixture
          -mod=readonly -p=1 -vet=off -count=1 -timeout=15m
          -run '^TestDefaultOrdinaryHelperCoexists$' ./tests/prototype
      - name: LSP workspace and candidate sessions under production budgets
        run: >-
          python3 -B scripts/ci_go_test.py native-lsp-macros
          -mod=readonly -p=1 -vet=off -count=1 -timeout=15m
          -run '^(TestCandidateUsesFreshMacroSession|TestLanguageServerUnsavedProceduralMacro)$' ./internal/lsp
      - name: CLI generation under production budgets
        run: >-
          python3 -B scripts/ci_go_test.py native-cli-macros
          -mod=readonly -p=1 -vet=off -count=1 -timeout=15m
          -run '^TestGenerateMissingRuntimeDependency$' ./cmd/goxide
      - name: Cold-cache project compilation under production budgets
        run: >-
          python3 -B scripts/ci_go_test.py native-project-macros
          -mod=readonly -p=1 -vet=off -count=1 -timeout=15m
          -run '^TestP5ProjectBuildRunTestAndStableLock$' ./internal/compile
      - name: Verify every native contract actually passed
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          module = subprocess.check_output([os.environ['GO_BIN'], 'list', '-mod=readonly', '-m'], text=True).strip()
          required = {
              ('internal/lower', 'TestProcSnapshotPreparedRoleLifetime'),
              ('internal/playground', 'TestPackageCheckedProceduralSnapshot'),
              ('internal/procmacro', 'TestWASIHostSDKCommand'),
              ('internal/procmacro', 'TestWASIHostGoPackageInitIsBounded'),
              ('internal/procmacro', 'TestWASIHostTimeoutCancellationAndCumulativeBudget'),
              ('internal/compile', 'TestFormalCFGDerivedProtocols/true'),
              ('internal/format', 'TestFormattedTraitsMatchMacrosAndGenericsBuildAndRun'),
              ('tests/prototype', 'TestDefaultOrdinaryHelperCoexists'),
              ('internal/lsp', 'TestCandidateUsesFreshMacroSession'),
              ('internal/lsp', 'TestLanguageServerUnsavedProceduralMacro'),
              ('cmd/goxide', 'TestGenerateMissingRuntimeDependency'),
              ('internal/compile', 'TestP5ProjectBuildRunTestAndStableLock'),
          }
          observed = set()
          for path in pathlib.Path(os.environ['RUNNER_TEMP']).glob('goxide-go-test-*/go-test.jsonl'):
              for line in path.open():
                  event = json.loads(line)
                  if event.get('Action') == 'pass' and event.get('Test'):
                      observed.add((event['Package'].removeprefix(module + '/'), event['Test']))
          missing = sorted(required - observed)
          assert not missing, f'native contracts did not pass: {missing}'
          print(f'All {len(required)} native contracts passed.')
          PY
      - name: Ensure checks did not change tracked inputs
        run: git diff --exit-code
      - name: Preserve native test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: go-test-native
          path: ${{ runner.temp }}/goxide-go-test-*/
          if-no-files-found: ignore
          retention-days: 7

  web:
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.scope.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ needs.scope.outputs.go_version }}
          cache-dependency-path: go.sum
      - name: Prepare the pinned module graph
        run: |
          go version
          gcc --version
          echo "GO_BIN=$(command -v go)" >> "$GITHUB_ENV"
          module_prep_dir="$(mktemp -d "$RUNNER_TEMP/modules.XXXXXX")"
          cp go.mod go.sum "$module_prep_dir/"
          GOWORK=off GOFLAGS=-mod=readonly go mod download -modfile="$module_prep_dir/go.mod" all
          GOWORK=off GOFLAGS=-mod=readonly go mod verify -modfile="$module_prep_dir/go.mod"
          cmp go.mod "$module_prep_dir/go.mod"
          cmp go.sum "$module_prep_dir/go.sum"
          echo 'GOPROXY=off' >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install locked frontend and QA dependencies
        run: npm ci --prefix website
      - name: Website build identity regressions
        run: python3 -B website/build_support_test.py
      - name: Worker observation protocol regressions
        run: node --test website/validation/worker-observations_test.mjs
      - name: Compiler UI synchronous invalidation regressions
        run: node website/compiler_test.mjs
      - name: Browser macro loading and deadline regressions
        run: node --test website/proc-macro-host_test.mjs
      - name: WASI SDK and Worker contracts
        env:
          GOMAXPROCS: '1'
        run: npm run test:proc-macro --prefix website
      - name: Verify the runner browser with its sandbox enabled
        working-directory: website
        run: |
          export CHROMIUM="${CHROME_BIN:-$(command -v google-chrome)}"
          test -x "$CHROMIUM"
          printf 'Browser: %s\n' "$CHROMIUM"
          "$CHROMIUM" --version
          echo "CHROMIUM=$CHROMIUM" >> "$GITHUB_ENV"
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({ executablePath: process.env.CHROMIUM, headless: true, chromiumSandbox: true });
          try {
              const page = await browser.newPage();
              console.log(await page.evaluate(() => navigator.userAgent));
          } finally {
              await browser.close();
          }
          JS
      - name: Build matching CLI examples, exports and WASM offline
        run: python3 -B website/build.py --worktree
      - name: Audit website artifacts
        run: python3 -B website/hosting/audit.py
      - name: Sandboxed browser and route acceptance
        env:
          QA_URL: http://127.0.0.1:8084
          GOMAXPROCS: '1'
        run: |
          python3 -B website/hosting/preview.py --port 8084 --headers > "$RUNNER_TEMP/website-preview.log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          python3 - <<'PY'
          import os, time, urllib.request
          deadline = time.monotonic() + 30
          while time.monotonic() < deadline:
              try:
                  with urllib.request.urlopen(os.environ['QA_URL'] + '/examples.json', timeout=1) as response:
                      if response.status == 200:
                          break
              except OSError:
                  pass
              time.sleep(0.5)
          else:
              raise SystemExit('website preview did not become ready')
          PY
          npm test --prefix website
          node website/hosting/qa-routes.mjs
      - name: Embedded HTTP server race gate
        run: python3 -B scripts/ci_go_test.py web-race -mod=readonly -race -vet=off -tags=goxideweb -count=1 -timeout=10m ./cmd/goxide-web
      - name: Embedded HTTP server vet gate
        run: go vet -mod=readonly -tags=goxideweb ./cmd/goxide-web
      - name: Ensure build did not change tracked inputs
        run: git diff --exit-code
      - name: Preserve HTTP test logs
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: go-test-web
          path: ${{ runner.temp }}/goxide-go-test-*/
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve browser diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: website-qa
          path: |
            website/qa-artifacts/
            ${{ runner.temp }}/website-preview.log
          if-no-files-found: ignore
          retention-days: 7

  compiler:
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux_amd64
          - runner: ubuntu-24.04-arm
            target: linux_arm64
          - runner: macos-15-intel
            target: darwin_amd64
          - runner: macos-15
            target: darwin_arm64
          - runner: windows-2025
            target: windows_amd64
          - runner: windows-11-arm
            target: windows_arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.scope.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ needs.scope.outputs.go_version }}
          cache-dependency-path: go.sum
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Build, unpack and exercise the native CLI
        env:
          RELEASE_TAG: ${{ needs.scope.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: python -B scripts/release.py
      - name: Ensure packaging did not change tracked inputs
        run: git diff --exit-code
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: goxide-${{ matrix.target }}
          path: release-dist/*
          if-no-files-found: error
          retention-days: 7

  extension:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.scope.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install locked extension dependencies
        run: npm ci --prefix editors/vscode
      - name: Check extension behavior and JavaScript
        run: |
          npm test --prefix editors/vscode
          npm run check --prefix editors/vscode
      - name: Package the universal VSIX without tool binaries
        env:
          RELEASE_TAG: ${{ needs.scope.outputs.version }}
          RELEASE_PRERELEASE: ${{ needs.scope.outputs.prerelease }}
        run: python3 -B scripts/package_extension.py
      - name: Ensure packaging did not change tracked inputs
        run: git diff --exit-code
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: goxide-vsix
          path: release-dist/*.vsix
          if-no-files-found: error
          retention-days: 7

  summary:
    name: CI summary
    if: always()
    needs: [scope, checks, race, native, web, compiler, extension]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report required results
        env:
          SCOPE: ${{ needs.scope.result }}
          CHECKS: ${{ needs.checks.result }}
          RACE: ${{ needs.race.result }}
          NATIVE: ${{ needs.native.result }}
          WEB: ${{ needs.web.result }}
          COMPILER: ${{ needs.compiler.result }}
          EXTENSION: ${{ needs.extension.result }}
          WEB_REQUIRED: ${{ needs.scope.outputs.web }}
        run: |
          {
            echo '| Layer | Result |'
            echo '| --- | --- |'
            echo "| Scope | $SCOPE |"
            echo "| Native-only / production budgets | $NATIVE |"
            echo "| Race (all packages / two compile and four acceptance shards) | $RACE |"
            echo "| Vet / gofmt / docs | $CHECKS |"
            echo "| WASM build / HTTP | $WEB |"
            echo "| Six native CLI archives | $COMPILER |"
            echo "| Universal VSIX | $EXTENSION |"
            echo '| Browser UI / real Worker QA | Not run; tracked gap in docs/ci.md |'
          } >> "$GITHUB_STEP_SUMMARY"
          test "$SCOPE" = success
          test "$CHECKS" = success
          test "$RACE" = success
          test "$NATIVE" = success
          test "$COMPILER" = success
          test "$EXTENSION" = success
          if [ "$WEB_REQUIRED" = true ]; then
            test "$WEB" = success
          else
            test "$WEB" = skipped
          fi
