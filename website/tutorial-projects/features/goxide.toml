[go_mod]
module = "example.org/orders"
go = "1.27"

[namespaces]
order = "example.org/orders/order"

[[bin]]
name = "orders"
path = "cmd/orders"

[dependencies]
fmt = { go = "fmt" }
testing = { go = "testing" }
reporter = { module = "example.org/reporter", path = "reporter", optional = true, default_features = false }

[features]
default = ["pretty"]
pretty = []
trace = []
report = ["dep:reporter", "reporter/pretty"]
