[package]
format = 2
module = "example.org/hgo-project"
go = "1.27"

[[bin]]
name = 'hello'
path = 'src/main.hgo'

[[bin]]
name = 'inspect'
path = 'src/inspect.hgo'

[[example]]
name = 'greet'
path = 'examples/greet.hgo'

[features]
default = ['pretty']
pretty = []

[lib]
name = 'greeting'
path = 'src/lib.hgo'


[[go.require]]
module = "github.com/goxide-lang/serde"
version = "v0.0.0-20261004120911-a1b791e96d66"

[[go.require]]
module = "github.com/goxide-lang/std"
version = "v0.0.0-20261004120854-3f2204770fd3"
