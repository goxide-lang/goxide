[package]
format = 2
module = "example.org/buildscript"
go = "1.27"

[package.namespaces]
gen = "example.org/buildscript/gen"

[[bin]]
name = 'app'
path = 'cmd/app'

[build]
entry = 'tools/build/build.gox'
inputs = ['schema.txt']
outputs = ['gen/schema.go', 'gen/data.txt']
timeout_seconds = 60


[[go.require]]
module = "github.com/goxide-lang/serde"
version = "v0.0.0-20261009021520-f342a31e20d0"

[[go.require]]
module = "github.com/goxide-lang/std"
version = "v0.0.0-20261009104839-c02a09d8c417"

[dependencies.fmt]
source = "toolchain"
package = "fmt"

[dependencies.json]
source = "toolchain"
package = "encoding/json"

[dependencies.os]
source = "toolchain"
package = "os"

[dependencies.filepath]
source = "toolchain"
package = "path/filepath"

[dependencies.strings]
source = "toolchain"
package = "strings"
