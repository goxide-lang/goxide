[package]
format = 2
module = "example.org/goxide-project"
go = "1.27"

[[bin]]
name = 'hello'
path = 'src/main.gox'

[[bin]]
name = 'inspect'
path = 'src/inspect.gox'

[[example]]
name = 'greet'
path = 'examples/greet.gox'

[features]
default = ['pretty']
pretty = []

[lib]
name = 'greeting'
path = 'src/lib.gox'


[[go.require]]
module = "github.com/goxide-lang/serde"
version = "v0.0.0-20261004120911-a1b791e96d66"

[[go.require]]
module = "github.com/goxide-lang/std"
version = "v0.0.0-20261004173304-ce5bccb4ff9c"
